name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'tarik02-org/t3code-gateway' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm fetch --frozen-lockfile --prefer-offline

      - run: pnpm install --frozen-lockfile --offline

      - run: pnpm fmt:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - id: image
        name: Resolve image metadata
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'build-image'))
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" == v* ]]; then
            version="${RELEASE_TAG#v}"
            artifact_kind="release"
            artifact_name="runtime-app"
          else
            version="pr-$PR_NUMBER"
            artifact_kind="pr"
            artifact_name="pr-image-${PR_NUMBER}-${HEAD_SHA}"
          fi

          {
            echo "version=$version"
            echo "artifact_kind=$artifact_kind"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build container artifact
        if: steps.image.outputs.artifact_kind != ''
        uses: ./.github/actions/container-build
        with:
          artifact-kind: ${{ steps.image.outputs.artifact_kind }}
          artifact-name: ${{ steps.image.outputs.artifact_name }}
          version: ${{ steps.image.outputs.version }}

  publish:
    name: Publish release image
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-app
          path: packaging/runtime/app

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          files: docker-bake.hcl
          source: .
          push: true
