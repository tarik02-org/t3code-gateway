name: PR image

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: pr-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container image
    # Publishing is intentionally limited to same-repository PRs. Fork PRs skip
    # this job and continue to use the regular read-only CI workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'build-image') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build-image'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile --prefer-offline
          pnpm install --frozen-lockfile --offline

      - name: Build application
        run: pnpm build

      - name: Download bundled T3 Code versions
        run: pnpm download:t3code-web

      - name: Prepare container runtime
        run: T3CODE_WEB_DIST=packaging/runtime/t3code-web-dist pnpm package:runtime

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve image tag
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_NUMBER" ]]; then
            version="pr-$PR_NUMBER"
          else
            version="manual-$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/$GITHUB_REPOSITORY:$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish container image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        with:
          files: docker-bake.hcl
          source: .
          push: true

      - name: Comment image reference
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        with:
          script: |
            const marker = "<!-- pr-image-build -->";
            const body = [
              marker,
              "### PR container image",
              "",
              `\`${process.env.IMAGE_REF}\``,
              "",
              `Built from ${process.env.HEAD_SHA.slice(0, 7)}.`,
              "",
              "```sh",
              `docker pull ${process.env.IMAGE_REF}`,
              "```",
              "",
              "The image is rebuilt after every push while the `build-image` label remains on this PR.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
