name: changesets

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: ${{ github.repository == 'tarik02-org/t3code-gateway' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm fetch --frozen-lockfile --prefer-offline

      - run: pnpm install --frozen-lockfile --offline

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm changeset:version
          pr-title: version packages
          commit-message: version packages

      - if: ${{ steps.changesets.outputs.has-changesets == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="$(jq -r '.version' packages/server/package.json)"
          tag="v${version}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}"
            git push origin "${tag}"
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --title "${tag}" --generate-notes
          fi
