name: Publish PR image

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: pr-image-publish-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish container image
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      IMAGE_REF: ghcr.io/${{ github.repository }}:pr-${{ github.event.workflow_run.pull_requests[0].number }}
      ARTIFACT_NAME: pr-image-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
    steps:
      - id: eligibility
        name: Verify current PR state
        shell: bash
        run: |
          set -euo pipefail

          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          has_label="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name] | index("build-image") != null')"

          if [[ "$state" != open || "$current_sha" != "$HEAD_SHA" || "$has_label" != true ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale, closed, or unlabeled PR image run."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Download container artifact
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN_ID }}

      - name: Log in to GitHub Container Registry
        if: steps.eligibility.outputs.eligible == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish container image
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          docker load --input pr-image.tar
          docker tag "t3code-gateway:pr-$PR_NUMBER" "$IMAGE_REF"
          docker push "$IMAGE_REF"

      - id: find-comment
        name: Find image comment
        if: steps.eligibility.outputs.eligible == 'true'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.0.0
        with:
          issue-number: ${{ env.PR_NUMBER }}
          body-includes: "<!-- pr-image-build -->"

      - name: Update image comment
        if: steps.eligibility.outputs.eligible == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ env.PR_NUMBER }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-image-build -->
            ### PR container image

            `${{ env.IMAGE_REF }}`

            Built from `${{ env.HEAD_SHA }}`.

            ```sh
            docker pull ${{ env.IMAGE_REF }}
            ```

            The image is rebuilt after every push while the `build-image` label remains on this PR.
