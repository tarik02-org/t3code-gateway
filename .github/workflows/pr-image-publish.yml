name: Publish PR image

on:
  workflow_run:
    workflows: [PR image build]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: pr-image-publish-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish container image
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      IMAGE_REF: ghcr.io/${{ github.repository }}:pr-${{ github.event.workflow_run.pull_requests[0].number }}
      ARTIFACT_NAME: pr-image-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
    steps:
      - id: eligibility
        name: Verify current PR state
        shell: bash
        run: |
          set -euo pipefail

          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          has_label="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name] | index("build-image") != null')"

          if [[ "$state" != open || "$current_sha" != "$HEAD_SHA" || "$has_label" != true ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale, closed, or unlabeled PR image run."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Download container artifact
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN_ID }}

      - name: Log in to GitHub Container Registry
        if: steps.eligibility.outputs.eligible == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish container image
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          docker load --input pr-image.tar
          docker tag "t3code-gateway:pr-$PR_NUMBER" "$IMAGE_REF"
          docker push "$IMAGE_REF"

      - name: Comment image reference
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const marker = "<!-- pr-image-build -->";
            const body = [
              marker,
              "### PR container image",
              "",
              `\`${process.env.IMAGE_REF}\``,
              "",
              `Built from ${process.env.HEAD_SHA.slice(0, 7)}.`,
              "",
              "```sh",
              `docker pull ${process.env.IMAGE_REF}`,
              "```",
              "",
              "The image is rebuilt after every push while the `build-image` label remains on this PR.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
