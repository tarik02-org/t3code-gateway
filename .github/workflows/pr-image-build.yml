name: PR image build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-image-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container artifact
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'build-image') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build-image')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile --prefer-offline
          pnpm install --frozen-lockfile --offline

      - name: Build application
        run: pnpm build

      - name: Download bundled T3 Code versions
        run: pnpm download:t3code-web

      - name: Prepare container runtime
        run: T3CODE_WEB_DIST=packaging/runtime/t3code-web-dist pnpm package:runtime

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build container artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          docker buildx build
          --file Containerfile
          --tag "t3code-gateway:pr-${PR_NUMBER}"
          --output "type=docker,dest=pr-image.tar"
          .

      - name: Upload container artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-image-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: pr-image.tar
          if-no-files-found: error
          retention-days: 7
