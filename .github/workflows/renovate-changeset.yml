name: renovate changeset

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: renovate-changeset-${{ github.head_ref }}

jobs:
  changeset:
    # renovate.json labels the updates that change what ships in the image.
    if: >-
      github.repository == 'tarik02-org/t3code-gateway' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/') &&
      contains(github.event.pull_request.labels.*.name, 'changeset')
    runs-on: ubuntu-latest
    steps:
      # Pushes made with GITHUB_TOKEN start no workflows, so CI would skip the changeset commit.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Add changeset
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          file=".changeset/${BRANCH//\//-}.md"
          if [[ -f "$file" ]]; then
            echo "$file already exists"
            exit 0
          fi

          summary="$(sed -E 's/^[a-z]+(\([^)]*\))?!?: //' <<<"$TITLE")"
          printf -- '---\n"@t3code-gateway/server": patch\n---\n\n%s\n' "${summary^}" >"$file"

          # renovate.json lists this author in gitIgnoredAuthors, so Renovate keeps rebasing the branch.
          git config user.name "t3code-gateway-release[bot]"
          git config user.email "311177698+t3code-gateway-release[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: add changeset"
          git push
