packages:
  - packages/*

catalog:
  "@effect/platform-node": 4.1.6
  # @effect/platform-node takes any ^4 shared build; newer ones import modules this effect lacks.
  "@effect/platform-node-shared": 4.1.6
  "@effect/sql-sqlite-node": 4.1.6
  "@effect/tsgo": 0.73.7
  "@tanstack/react-query": 5.108.4
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.7
  "@tanstack/router-plugin": 1.169.0
  "@types/node": 24.19.4
  "@types/react": ~19.3.3
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.3.0
  effect: 4.1.6
  typescript: ~7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  yaml: ^2.9.1

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 10 skipped these scripts silently; nothing here needs them (the server uses node:sqlite).
allowBuilds:
  better-sqlite3: false
  esbuild: false

# Renovate's minimumReleaseAge matches this, so it never proposes a version pnpm would reject.
minimumReleaseAge: 1440
# Our own package; its releases are reviewed here before they ship.
minimumReleaseAgeExclude:
  - t3code-cli
